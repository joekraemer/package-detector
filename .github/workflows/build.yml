# Build the container image on every push to main and publish it to GHCR as
# ghcr.io/<owner>/<repo>:main. The fleet host pulls that tag on its own
# schedule, so "push to main" IS the deploy. Mirrors birdlisten's workflow.
#
# Also pushes :sha-<short> so a bad release can be pinned back in
# fleet/compose.yaml by changing one tag.
#
# Platforms: linux/amd64 only (the fleet host is Intel, same as birdlisten).
# To also run on ARM, add linux/arm64 to `platforms` and uncomment QEMU.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # - uses: docker/setup-qemu-action@v3      # only for arm64 cross-builds
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the image must at least start and parse --help. Catches
      # a broken requirements file or a bad module name before the fleet pulls it.
      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -1)
          echo "testing $tag"
          docker run --rm -e LOOP_ONCE=1 -e RUN_ARGS="--help" "$tag" 2>&1 | tail -20

      # Unit tests run in the image's own Python (stdlib only, no camera,
      # no model, no network) — same gate as the local `python -m unittest`.
      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: |
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -1)
          docker run --rm --entrypoint python "$tag" -m unittest discover -s tests -v
